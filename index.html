    <!-- Google Fonts: Newsreader (Serif), Plus Jakarta Sans (Interface), JetBrains Mono (Scholarly identifiers) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,300..800;1,6..72,300..800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <body class="bg-parchment-50 text-slate-900 font-sans antialiased transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Cloudflare Web Analytics (Privacy-First, Cookie-Free) -->
    <!-- 
      Note: If your custom domain is connected via Cloudflare DNS (Orange cloud),
      Cloudflare can automatically inject analytics without any token needed.
      If using manual JS beacon, replace the token below with your site's token from:
      Cloudflare Dashboard -> Web Analytics -> Manage Site.
    -->
    <script>
      (function() {
        // Optional: Paste your Cloudflare Web Analytics token below if not using Cloudflare Proxy Automatic Injection
        var cfToken = window.CF_BEACON_TOKEN || "";
        if (cfToken && cfToken !== "YOUR_CLOUDFLARE_ANALYTICS_TOKEN") {
          var cfScript = document.createElement("script");
          cfScript.defer = true;
          cfScript.src = "https://static.cloudflareinsights.com/beacon.min.js";
          cfScript.setAttribute("data-cf-beacon", '{"token": "' + cfToken + '"}');
          document.head.appendChild(cfScript);
        }
      })();
    </script>
    <!-- End Cloudflare Web Analytics -->
  </body>
</html>
